<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Login | SentinelLink Beta
    </title>

    <meta name="description"
        content="Login to SentinelLink Beta emergency reporting platform.">

    <meta name="theme-color"
        content="#2563EB">


    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet"
        href="../css/style.css">

</head>


<body>


<header class="navbar">

    <div class="container nav-container">


        <a href="index.html"
            class="logo">


            <div class="logo-icon">
                SL
            </div>


            <div class="logo-text">

                <h1>
                    SentinelLink Beta
                </h1>

                <span>
                    Emergency Reporting Platform
                </span>

            </div>


        </a>


    </div>

</header>



<main>


<section class="hero">


<div class="container">


<div class="form-card"
style="max-width:450px;margin:40px auto;">



<div class="section-heading"
style="margin-bottom:30px;">


<h2>
    Welcome Back
</h2>


<p>
    Sign in to access SentinelLink services.
</p>


</div>



<form id="loginForm">


<div class="form-group">


<label for="username">

Username

</label>


<input
type="text"
id="username"
name="username"
placeholder="Enter username"
required>


</div>



<div class="form-group">


<label for="password">

Password

</label>


<div style="position:relative;">


<input
type="password"
id="password"
name="password"
placeholder="Enter password"
required>



<button
type="button"
id="togglePassword"
style="
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
cursor:pointer;
color:#2563EB;
">

Show

</button>


</div>


</div>



<div style="
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
">


<input
type="checkbox"
id="remember"
style="width:auto;">


<label for="remember">

Remember me

</label>


</div>



<button
type="submit"
class="btn btn-primary"
style="width:100%;">

Login

</button>



<p id="loginMessage"
style="
margin-top:20px;
text-align:center;
color:#DC2626;
">

</p>



</form>



<div style="
margin-top:25px;
padding:15px;
background:#F8FAFC;
border-radius:10px;
font-size:14px;
">


<strong>
Demo Account
</strong>

<br><br>

Username:
<code>
admin
</code>

<br>

Password:
<code>
admin123
</code>


</div>



</div>


</div>


</section>


</main>
<script>

const loginForm = document.getElementById("loginForm");

const passwordInput = document.getElementById("password");

const togglePassword = document.getElementById("togglePassword");

const loginMessage = document.getElementById("loginMessage");


// Show / Hide Password

togglePassword.addEventListener("click", function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        togglePassword.textContent = "Hide";

    }

    else{

        passwordInput.type = "password";

        togglePassword.textContent = "Show";

    }

});


// Login System

loginForm.addEventListener("submit", function(event){

    event.preventDefault();


    const username =
        document.getElementById("username").value.trim();


    const password =
        passwordInput.value.trim();


    const remember =
        document.getElementById("remember").checked;



    /*
        Beta Credentials

        Future versions:
        Replace this with Firebase Authentication
    */

    if(username === "admin" && password === "admin123"){



        const sessionData = {

            username: username,

            role: "Administrator",

            loginTime: new Date().toISOString()

        };



        if(remember){

            localStorage.setItem(
                "sentinelSession",
                JSON.stringify(sessionData)
            );

        }

        else{

            sessionStorage.setItem(
                "sentinelSession",
                JSON.stringify(sessionData)
            );

        }



        loginMessage.style.color = "#16A34A";

        loginMessage.textContent =
            "Login successful. Redirecting...";



        setTimeout(function(){

            window.location.href =
                "index.html";

        },1000);



    }


    else{


        loginMessage.style.color =
            "#DC2626";


        loginMessage.textContent =
            "Invalid username or password.";


    }



});


// Auto redirect if already logged in

window.addEventListener("load", function(){


    const savedSession =
        localStorage.getItem("sentinelSession")
        ||
        sessionStorage.getItem("sentinelSession");



    if(savedSession){

        // Uncomment if you want automatic redirect
        // window.location.href="index.html";

    }


});


</script>


</body>

</html>
