<main>




<section class="hero">


<div class="container">





<div class="section-heading"
style="text-align:left;">



<h2>

Report Emergency Incident

</h2>



<p>

Provide accurate details to help
responders understand and manage
the situation.

</p>



</div>





<div class="form-card">



<form id="incidentForm">

<!-- Reporter Information -->

<div class="form-group">

<label for="reporter">

Reporter Name

</label>


<input
type="text"
id="reporter"
name="reporter"
placeholder="Enter your name"
required>

</div>




<div class="form-group">


<label for="contact">

Contact Number

</label>



<input

type="tel"

id="contact"

name="contact"

placeholder="Enter contact number"

required>


</div>





<!-- Incident Details -->


<div class="form-group">


<label for="type">

Incident Type

</label>



<select
id="type"
name="type"
required>


<option value="">
Select incident type
</option>


<option value="Fire">

Fire

</option>


<option value="Flood">

Flood

</option>


<option value="Medical">

Medical Emergency

</option>


<option value="Accident">

Accident

</option>


<option value="Railway">

Railway Hazard

</option>


<option value="Crime">

Safety Threat

</option>


<option value="Other">

Other

</option>


</select>


</div>





<div class="form-group">


<label for="priority">

Priority Level

</label>



<select
id="priority"
name="priority"
required>



<option value="Low">

Low

</option>



<option value="Medium"
selected>

Medium

</option>



<option value="High">

High

</option>



<option value="Critical">

Critical

</option>



</select>



</div>






<!-- Location -->


<div class="form-group">


<label for="location">

Incident Location

</label>



<input

type="text"

id="location"

name="location"

placeholder="Enter location"

required>


</div>





<!-- Description -->


<div class="form-group">


<label for="description">

Incident Description

</label>



<textarea

id="description"

name="description"

placeholder="Describe the emergency situation..."

required></textarea>


</div>





<!-- Submit -->


<button

type="submit"

class="btn btn-primary"

style="width:100%;">

Submit Emergency Report

</button>





<p

id="reportMessage"

style="
margin-top:20px;
text-align:center;
">

</p>


</form>


</div>


</div>


</section>

<script src="../js/app.js"></script>


<script>


// Protect page

requireLogin();





const incidentForm =
    document.getElementById(
        "incidentForm"
    );



const reportMessage =
    document.getElementById(
        "reportMessage"
    );





incidentForm.addEventListener(
"submit",
function(event){


    event.preventDefault();



    const reportData = {


        reporter:

        document.getElementById(
            "reporter"
        ).value.trim(),



        contact:

        document.getElementById(
            "contact"
        ).value.trim(),



        type:

        document.getElementById(
            "type"
        ).value,



        priority:

        document.getElementById(
            "priority"
        ).value,



        location:

        document.getElementById(
            "location"
        ).value.trim(),



        description:

        document.getElementById(
            "description"
        ).value.trim()


    };





    // Basic validation


    if(
        !reportData.reporter ||
        !reportData.contact ||
        !reportData.type ||
        !reportData.location ||
        !reportData.description
    ){


        reportMessage.style.color =
            "#DC2626";


        reportMessage.textContent =
            "Please complete all required fields.";


        return;


    }





    // Save incident


    const newReport =
        createReport(reportData);





    reportMessage.style.color =
        "#16A34A";



    reportMessage.textContent =

    "Report submitted successfully. ID: "
    +
    newReport.id;





    // Reset form


    incidentForm.reset();





    // Redirect after delay


    setTimeout(function(){


        window.location.href =
            "dashboard.html";


    },1500);




});



</script>



</main>
