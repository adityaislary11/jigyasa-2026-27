<script src="../js/app.js"></script>


<script>


// Protect page

requireLogin();





const map =
document.getElementById(
    "incidentMap"
);



const incidentList =
document.getElementById(
    "mapIncidentList"
);







function loadMapData(){



    const reports =
        getReports();




    map.innerHTML = "";



    incidentList.innerHTML = "";





    if(reports.length === 0){



        incidentList.innerHTML =

        `

        <p>
        No active incidents available.
        </p>

        `;



        return;


    }







    reports.forEach(
    (report,index)=>{





        // Create map marker


        const marker =
        document.createElement(
            "div"
        );



        marker.className =
            "map-marker";



        marker.style.left =
            (20 + (index * 13)%70)
            + "%";



        marker.style.top =
            (20 + (index * 19)%60)
            + "%";





        if(report.priority === "Critical"
        ||
        report.priority === "High"){


            marker.classList.add(
                "danger"
            );


        }

        else if(report.status === "Resolved"){


            marker.classList.add(
                "safe"
            );


        }

        else{


            marker.classList.add(
                "warning"
            );


        }





        marker.title =
            report.type
            +
            " - "
            +
            report.location;





        map.appendChild(
            marker
        );








        // Incident card


        const card =
        document.createElement(
            "div"
        );



        card.className =
            "status-item";



        card.innerHTML =

        `

        <span>

        ${report.type}

        <br>

        <small>
        ${report.location}
        </small>

        </span>


        <strong>

        ${report.status}

        </strong>


        `;



        incidentList.appendChild(
            card
        );



    });


}







document.addEventListener(
"DOMContentLoaded",
function(){


    loadMapData();


});



</script>
